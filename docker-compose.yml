services:
  seerr-catalog:
    image: ghcr.io/aerya/stremio-seerr-catalog:latest
    # Existing root-owned volumes: set CONTAINER_USER=0:0 before updating.
    # New bind mounts must be writable by UID/GID 1000:1000.
    user: "${CONTAINER_USER:-1000:1000}"
    container_name: seerr-catalog
    ports:
      - "7000:7000"
    env_file:
      - .env
    environment:
      - BASE_URL=${BASE_URL}
      - API_KEY=${API_KEY}
      - PORT=${PORT}
      - HOST=${HOST}
      - TMDB_API_KEY=${TMDB_API_KEY}
    volumes:
      - /mnt/Docker/stremio/seerrcatalog:/app/data
    restart: always
